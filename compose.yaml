services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cryptoanal_dev
      POSTGRES_USER: cryptoanal
      POSTGRES_PASSWORD: cryptoanal
    ports:
      - "5432:5432"
    volumes:
      - cryptoanal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoanal -d cryptoanal_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      API_PORT: 3100
      DATABASE_URL: postgresql://cryptoanal:cryptoanal@postgres:5432/cryptoanal_dev?schema=public
      DASHBOARD_ORIGIN: http://localhost:5173
    ports:
      - "3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://cryptoanal:cryptoanal@postgres:5432/cryptoanal_dev?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: .
      target: dashboard
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  cryptoanal-postgres:
