services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cryptoanal_dev
      POSTGRES_USER: cryptoanal
      POSTGRES_PASSWORD: cryptoanal
    ports:
      - "5432:5432"
    volumes:
      - cryptoanal-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoanal -d cryptoanal_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cryptoanal-postgres:
